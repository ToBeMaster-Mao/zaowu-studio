<html lang="zh-CN">
<head>

  <title>Model Studio · 三维视口</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#16191d}
    #viewport{position:absolute;inset:0;outline:none}canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
    #notice{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;color:#a2abb8;font-size:12px;gap:14px;padding:30px;line-height:1.7}
    #notice[hidden]{display:none}.spinner{height:24px;width:24px;border:2px solid #343b43;border-top-color:#c4eb7b;border-radius:50%;margin:auto;animation:spin .85s linear infinite}
    #notice.error{background:#16191def;color:#efb4a6}#notice.error .spinner{display:none}#notice-text{max-width:460px;overflow-wrap:anywhere}
    .hint{position:absolute;bottom:20px;left:24px;color:#66717d;font-size: 11px;letter-spacing:.08em;pointer-events:none;user-select:none}
    @keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
  </style>
  <style>
.orientation-control {
  position: absolute;
  top: 54px;
  right: 18px;
  width: 112px;
  height: 112px;
  user-select: none;
  -webkit-user-select: none;
  pointer-events: none;
  z-index: 5;
}
.orientation-cube { display: block; width: 112px; height: 112px; overflow: visible; }
.orientation-face {
  --face-fill: #30363b;
  --face-stroke: #616b72;
  --face-text: #d2d8dc;
  cursor: pointer;
  outline: none;
  pointer-events: auto;
}
.orientation-face.face-side, .orientation-face.face-opposite-side { --face-fill: #292f34; }
.orientation-face.face-top { --face-fill: #414b36; --face-stroke: #8da66b; --face-text: #d6e8b9; }
.orientation-face.face-bottom { --face-fill: #252b2f; }
.orientation-face polygon {
  fill: var(--face-fill);
  stroke: var(--face-stroke);
  stroke-width: 1.15;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
  transition: fill .14s, stroke .14s;
}
.orientation-face text { fill: var(--face-text); font-size: 13px; font-weight: 500; pointer-events: none; }
.orientation-face:hover polygon, .orientation-face:focus-visible polygon { fill: #46533b; stroke: #c5df9b; stroke-width: 1.5; }
.orientation-face:hover text, .orientation-face:focus-visible text { fill: #e0f2c3; }
.orientation-face.is-aligned polygon { stroke: #a8c37f; }
.orientation-face:focus-visible polygon { stroke-width: 2; }
.orientation-reset {
  position: absolute;
  right: 0;
  bottom: 0;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  padding: 0;
  appearance: none;
  -webkit-appearance: none;
  border: 1px solid #3b434a;
  border-radius: 50%;
  background: #20262bdd;
  color: #aab3bb;
  pointer-events: auto;
  cursor: pointer;
  transition: color .14s, background .14s, border-color .14s;
}
.orientation-reset:hover { color: #d6e9b5; border-color: #778962; background: #2a3325; }
.orientation-reset:focus-visible { outline: 2px solid #c5df9b; outline-offset: 3px; }
.orientation-reset svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 520px) {
  .orientation-control { right: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .orientation-face polygon, .orientation-reset { transition: none; }
}

  </style>

</head>

  <div id="viewport" aria-label="可旋转、缩放并点选部件的三维模型视口"></div>
  <div id="notice" role="status"><div class="spinner"></div><div id="notice-text">正在载入三维模型…</div></div>
  <div class="hint">拖动旋转 · 滚轮缩放 · 点击选择部件</div>
