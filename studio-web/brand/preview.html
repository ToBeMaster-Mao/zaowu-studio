<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>造物 · Brand preview</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  *{box-sizing:border-box}body{margin:0;background:#141719;color:#f0f3ec;font-family:"Segoe UI","Microsoft YaHei",sans-serif;padding:48px clamp(24px,6vw,96px)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:52px}header img{width:182px}header span{font-size:11px;letter-spacing:3px;color:#818e8e}main{max-width:1080px;margin:auto}.hero{min-height:320px;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:72px;border-bottom:1px solid #2a3031;padding-bottom:52px}.hero>img{width:min(100%,240px);justify-self:center}.eyebrow{font-size:11px;letter-spacing:4px;color:#9eafaa}h1{font-size:36px;font-weight:500;letter-spacing:3px;margin:16px 0}p{font-size:13px;line-height:1.9;color:#98a6a2;max-width:320px}.samples{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-top:32px}.sample{min-height:152px;border:1px solid #303737;border-radius:12px;padding:20px;display:flex;flex-direction:column;justify-content:space-between}.sample label{font-size:10px;color:#8d9c97;letter-spacing:2px}.sizes{display:flex;gap:22px;align-items:center;height:74px}.light{background:#edf1e8;border-color:#edf1e8}.light svg{color:#202622;width:58px;height:58px}.light label{color:#647165}.swatches{display:flex;gap:10px}.swatches i{width:38px;height:38px;border-radius:50%}footer{margin-top:28px;color:#667671;font-size:11px;letter-spacing:1px}@media(max-width:600px){.hero{grid-template-columns:1fr;gap:32px}.hero>img{width:150px}.samples{grid-template-columns:1fr}header span{display:none}}
</style>
<main>
  <header><img src="logo-lockup.svg" alt="造物 Studio"><span>BRAND IDENTITY / 01</span></header>
  <section class="hero"><img src="logo-mark.svg" alt="造物图形标识"><div><span class="eyebrow">IDEAS TAKE SHAPE</span><h1>让想法拥有形状</h1><p>两段折带，一个成形的 Z。<br>轻盈的切面与留白，连接灵感和创造。</p></div></section>
  <section class="samples">
    <div class="sample"><label>SMALL SCALE</label><div class="sizes"><img src="logo-mark.svg" width="48" height="48" alt="48 像素标识"><img src="logo-mark.svg" width="32" height="32" alt="32 像素标识"><img src="logo-mark.svg" width="24" height="24" alt="24 像素标识"><img src="favicon.svg" width="16" height="16" alt="16 像素标识"></div></div>
    <div class="sample light"><label>MONOCHROME</label><svg viewBox="0 0 64 64" fill="currentColor" role="img" aria-label="单色造物标识"><path d="M8 7H55L61 19L40 36L29 28L44 17H2L8 7Z M24 28L35 36L20 48H62L56 58H9L3 46L24 28Z"/></svg></div>
    <div class="sample"><label>COLOUR / #D3F28A</label><div class="swatches"><i style="background:#d3f28a"></i><i style="background:#edfccb"></i><i style="background:#9ec65b"></i><i style="background:#303737"></i></div></div>
  </section>
  <footer>造物 STUDIO · VECTOR BRAND ASSETS</footer>
</main>
</html>
