  <title>Model Studio · 三维视口</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#16191d}
    #viewport{position:absolute;inset:0;outline:none}#viewport canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
    #notice{position:absolute;inset:0;display:grid;grid-template:minmax(0,1fr)/minmax(0,1fr);place-items:center;text-align:center;pointer-events:none;color:#a2abb8;font-size:13px;padding:80px 24px 24px;line-height:1.7;overflow:hidden}
    #notice[hidden]{display:none}
    #notice-text{position:absolute;top:18px;left:50%;transform:translateX(-50%);display:grid;place-items:center;width:max-content;max-width:calc(100% - 480px);min-height:38px;overflow-wrap:anywhere}
    .loading-logo{position:relative;width:min(100%,640px);height:min(100%,490px);min-height:0}
    .loading-logo canvas{position:absolute;inset:0;display:block;width:100%;height:100%;opacity:0}
    .loading-logo svg{position:absolute;width:256px;height:256px;max-width:42%;max-height:53%;inset:0;margin:auto}
    .loading-logo.is-animated canvas{opacity:1}.loading-logo.is-animated svg{visibility:hidden}
    @media (max-width:899px){#notice{padding:142px 16px 24px}#notice-text{top:76px;max-width:calc(100% - 32px)}}
    @media (max-height:550px){#notice{padding-bottom:12px}}
    #notice.error{background:#16191def;color:#efb4a6;padding:80px 24px 24px}
    #notice.error .loading-logo{display:none}
    #notice.error #notice-text{position:static;transform:none;width:auto;max-width:min(100%,460px);max-height:100%;overflow:auto;pointer-events:auto}
  </style>
  <style>
.orientation-control {
  position: absolute;
  top: 54px;
  right: 18px;
  width: 112px;
  height: 165px;
  user-select: none;
  -webkit-user-select: none;
  pointer-events: none;
  z-index: 5;
}
.orientation-cube { display: block; width: 112px; height: 112px; overflow: visible; }
.orientation-face {
  --face-fill: #30363b;
  --face-stroke: #616b72;
  --face-text: #d2d8dc;
  cursor: pointer;
  outline: none;
  pointer-events: auto;
}
.orientation-face.face-side, .orientation-face.face-opposite-side { --face-fill: #292f34; }
.orientation-face.face-top { --face-fill: #414b36; --face-stroke: #8da66b; --face-text: #d6e8b9; }
.orientation-face.face-bottom { --face-fill: #252b2f; }
.orientation-face polygon {
  fill: var(--face-fill);
  stroke: var(--face-stroke);
  stroke-width: 1.15;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
  transition: fill .14s, stroke .14s;
}
.orientation-face text { fill: var(--face-text); font-size: 13px; font-weight: 500; pointer-events: none; }
.orientation-face:hover polygon, .orientation-face:focus-visible polygon { fill: #46533b; stroke: #c5df9b; stroke-width: 1.5; }
.orientation-face:hover text, .orientation-face:focus-visible text { fill: #e0f2c3; }
.orientation-face.is-aligned polygon { stroke: #a8c37f; }
.orientation-face:focus-visible polygon { stroke-width: 2; }
.orientation-axes { position: absolute; top: 97px; left: 0; width: 112px; height: 66px; overflow: visible; pointer-events: none; }
.orientation-axis.axis-x { color: #d98984; }
.orientation-axis.axis-y { color: #bfd982; }
.orientation-axis.axis-z { color: #82b4d6; }
.orientation-axis path { fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.orientation-axis text { fill: currentColor; font-size: 12px; font-weight: 600; }
.orientation-axis .orientation-axis-leader { opacity: .55; stroke-width: 1; stroke-dasharray: 1.5 2; }
@media (max-width: 520px) {
  .orientation-control { right: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .orientation-face polygon { transition: none; }
}

  </style>
